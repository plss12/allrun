name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Minimum Node version supported by Expo SDK 58 (see "engines" in package.json)
      - uses: actions/setup-node@v5
        with:
          node-version: '22.13'
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --ci
      # Bundle the JS for both platforms to catch build errors (native builds run on EAS)
      - run: npx expo export --platform ios --platform android
