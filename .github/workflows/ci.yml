name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Minimum Node version of the project (see "engines" in package.json); kept at what
      # Expo SDK 58 requires so the planned upgrade doesn't change it
      - uses: actions/setup-node@v5
        with:
          node-version: '22.13'
          cache: npm

      # Use the npm pinned in "packageManager": older npm versions disagree on the lockfile
      - run: npm install -g "$(node -p "require('./package.json').packageManager")"

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test -- --ci
      - run: npx expo-doctor
      # Bundle the JS for both platforms to catch build errors (native builds run on EAS)
      - run: npx expo export --platform ios --platform android
